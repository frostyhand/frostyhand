<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 14" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7c85f9" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes run { 0% { transform: translateX(140px) } 100% { transform: translateX(760px) } }
      @keyframes fade { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      .l { animation: fade 5s ease-in-out infinite }
      .s { animation: run 5s ease-in-out infinite }
      @media (prefers-reduced-motion: reduce) { .l,.s { animation: none } }
    </style>
  </defs>
  <rect class="l" x="0" y="6" width="900" height="2" fill="url(#line)"/>
  <circle class="s" cx="0" cy="7" r="7" fill="url(#spark)"/>
</svg>
