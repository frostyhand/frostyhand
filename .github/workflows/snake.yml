name: generate snake

on:
  schedule:
    # regenerate once a day
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: generate contribution snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%236366f1&color_dots=%23161b22,%2326306e,%233f4bd0,%236366f1,%2322d3ee
            dist/snake-light.svg?palette=github-light&color_snake=%234f46e5&color_dots=%23ebedf0,%23c7ccf8,%239aa2f4,%236366f1,%230891b2

      - name: publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
